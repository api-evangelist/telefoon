openapi: 3.2.0
info:
  title: Telefoon Voice Conferences API
  description: GDPR-compliant programmable voice API for European markets. Make and receive calls across Dutch, Belgian, German, and EU networks with multi-language TTS support.
  version: v1
  contact:
    name: Telefoon Support
    url: https://www.telefoon.com/support
    email: api-support@telefoon.com
  termsOfService: https://www.telefoon.com/terms
servers:
- url: https://api.telefoon.com/v1/voice
  description: Telefoon Voice API (EU data center)
security:
- ApiKeyAuth: []
tags:
- name: Conferences
  description: Multi-party conferencing
paths:
  /conferences:
    get:
      operationId: listConferences
      summary: List Conferences
      description: List conference calls.
      tags:
      - Conferences
      responses:
        '200':
          description: List of conferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  conferences:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conference'
    post:
      operationId: createConference
      summary: Create Conference
      description: Create a new conference room.
      tags:
      - Conferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                friendly_name:
                  type: string
                  description: Conference name
                max_participants:
                  type: integer
                  default: 100
                  description: Maximum participants
                record:
                  type: boolean
                  description: Record the conference (GDPR consent required)
      responses:
        '201':
          description: Conference created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conference'
components:
  schemas:
    Conference:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          description: Unique conference identifier
        friendly_name:
          type: string
          description: Conference name
        status:
          type: string
          enum:
          - init
          - in-progress
          - completed
        participant_count:
          type: integer
          description: Current participants
        date_created:
          type: string
          format: date-time
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
