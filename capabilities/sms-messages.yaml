naftiko: 1.0.0-alpha2
info:
  label: Telefoon SMS API — Messages
  description: 'Telefoon SMS API — Messages. 4 operations. Lead operation: List Messages. Self-contained Naftiko capability
    covering one Telefoon business surface.'
  tags:
  - Telefoon
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TELEFOON_API_KEY: TELEFOON_API_KEY
capability:
  consumes:
  - type: http
    namespace: sms-messages
    baseUri: https://api.telefoon.com/v1/sms
    description: Telefoon SMS API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: messages
      path: /messages
      operations:
      - name: listmessages
        method: GET
        description: List Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: direction
          in: query
          type: string
        - name: status
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: page_size
          in: query
          type: integer
      - name: sendmessage
        method: POST
        description: Send Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: messages-message_id
      path: /messages/{message_id}
      operations:
      - name: getmessage
        method: GET
        description: Get Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: message_id
          in: path
          type: string
          required: true
      - name: deletemessage
        method: DELETE
        description: Delete Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: message_id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.TELEFOON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sms-messages-rest
    port: 8080
    description: REST adapter for Telefoon SMS API — Messages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/messages
      name: messages
      description: REST surface for messages.
      operations:
      - method: GET
        name: listmessages
        description: List Messages
        call: sms-messages.listmessages
        with:
          direction: rest.direction
          status: rest.status
          page: rest.page
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: sendmessage
        description: Send Message
        call: sms-messages.sendmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{message-id}
      name: messages-message-id
      description: REST surface for messages-message_id.
      operations:
      - method: GET
        name: getmessage
        description: Get Message
        call: sms-messages.getmessage
        with:
          message_id: rest.message_id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletemessage
        description: Delete Message
        call: sms-messages.deletemessage
        with:
          message_id: rest.message_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sms-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Telefoon SMS API — Messages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-messages
      description: List Messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sms-messages.listmessages
      with:
        direction: tools.direction
        status: tools.status
        page: tools.page
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: send-message
      description: Send Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sms-messages.sendmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-message
      description: Get Message
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sms-messages.getmessage
      with:
        message_id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-message
      description: Delete Message
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: sms-messages.deletemessage
      with:
        message_id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
